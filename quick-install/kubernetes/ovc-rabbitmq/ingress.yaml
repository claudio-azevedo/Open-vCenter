apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ovc-rabbitmq-ingress
  namespace: ovc-infra
spec:
  ingressClassName: traefik
  rules:
    # AMQP itself (port 5672) is a binary protocol, not HTTP, so it can't be
    # routed by hostname here - clients (including the Hyper-V hosts) keep
    # using the 30672 NodePort directly. Only the management web UI goes
    # through Traefik.
    - host: rabbitmq-management.openvcenter.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ovc-rabbitmq-service-nodeport
                port: { name: management }
