apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovc-frontend
  namespace: ovc-infra
spec:
  replicas: 1
  selector: { matchLabels: { app: ovc-frontend } }
  template:
    metadata: { labels: { app: ovc-frontend } }
    spec:
      containers:
        - name: ovc-frontend
          image: ghcr.io/claudio-azevedo/ovc-frontend:latest
          envFrom:
            - configMapRef: { name: ovc-frontend-configmap }
            # BETTER_AUTH_SECRET - generated by apply.sh on first run.
            - secretRef: { name: ovc-frontend-secret }
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 20
