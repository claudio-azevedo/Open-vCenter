apiVersion: v1
kind: ConfigMap
metadata:
  name: ovc-frontend-configmap
  namespace: ovc-infra
data:
  # Server-only: base URL of ovc-backend's REST API, reached over the
  # cluster-internal Service DNS.
  API_URL: http://ovc-backend-service-nodeport:8000/api
  # guacd for the consoles. ovc-frontend serves the Guacamole tunnel
  # (/webrdp/tunnel) itself and connects to guacd server-to-server, over the
  # cluster-internal Service DNS (ovc-guacd/). host:port.
  GUACD_URL: ovc-guacd-service:4822
  VITE_OIDC_PROVIDER_NAME: Keycloak

  # OIDC. ISSUER must be the URL the *browser* used to reach Keycloak (its
  # Ingress host), since that's what ends up in the token's `iss` claim.
  OIDC_ISSUER: http://keycloak.openvcenter.local/realms/ovc
  OIDC_CLIENT_ID: ovc-frontend
  OIDC_CLIENT_SECRET: ovc-frontend-dev-secret

  # better-auth (cookie sessions, no database). BETTER_AUTH_SECRET is NOT
  # here on purpose - it's a signing key, not a shared default. apply.sh
  # generates it into the ovc-frontend-secret Secret on first run instead.
  BETTER_AUTH_URL: http://frontend.openvcenter.local/frontend-api/auth

  # VITE_API_URL is left unset on purpose - it defaults to the relative
  # /frontend-api/api, correct for this single-domain deployment.
