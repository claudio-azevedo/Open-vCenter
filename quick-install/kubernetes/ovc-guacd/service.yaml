apiVersion: v1
kind: Service
metadata:
  # ClusterIP - only ovc-frontend's server (in-cluster) talks to guacd, via
  # GUACD_URL; the browser never does, so no NodePort is needed.
  name: ovc-guacd-service
  namespace: ovc-infra
spec:
  type: ClusterIP
  selector: { app: ovc-guacd }
  ports: [{ name: guacd, port: 4822, targetPort: 4822 }]
